# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: voice-ai-orchestrator
    runtime: python
    plan: free            # use "starter" or higher for production (free instances sleep after 15 min idle)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --ws-ping-interval 20 --ws-ping-timeout 30
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ACCESS_TOKEN      # optional: protects the UI/API/WebSocket with a shared token
        sync: false
      - key: ALLOW_ENV_KEYS        # allow provider keys from env vars as a fallback to per-session keys
        value: "true"
      - key: DATA_DIR              # bot profiles (ephemeral on Render without a disk)
        value: /tmp/vao-data
      - key: MAX_SESSIONS
        value: "50"
      - key: LOG_LEVEL
        value: INFO
      # Optional server-side provider keys (add in the Render dashboard, never commit them):
      # SARVAM_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, GOOGLE_CLOUD_API_KEY,
      # AZURE_SPEECH_KEY, AZURE_SPEECH_REGION, AZURE_OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_DEPLOYMENT,
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, DEEPGRAM_API_KEY, ASSEMBLYAI_API_KEY,
      # ELEVENLABS_API_KEY, GROQ_API_KEY, MISTRAL_API_KEY, OPENROUTER_API_KEY
